<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>きょうも、ここで。試作版</title>
<style>
:root{--ink:#3c3835;--paper:#fffaf2;--line:#dccdbb;--blue:#dff1fb;--green:#e4f4df;--orange:#ffe7cf;--pink:#f9dfe2;--accent:#4189b7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#f2eee7;color:var(--ink)}button{font:inherit;cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh;background:var(--paper)}header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff}.logo{font-size:28px;font-weight:900;color:#397da7}.tag{font-size:13px;color:#786d64}.top{display:grid;grid-template-columns:150px 1fr 230px;gap:12px;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px #0000000a}.day{font-weight:900;font-size:22px}.clock{font-size:30px;font-weight:900}.timeline{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin-top:9px}.timeline>div{height:100%;background:#75aeca;width:8%}.main{display:grid;grid-template-columns:1fr 290px;gap:12px;padding:0 12px}.room{position:relative;min-height:510px;overflow:hidden;background:linear-gradient(#e9f6fc 0 34%,#f2e2c8 34% 100%)}.window{height:105px;background:linear-gradient(#cceafa,#fff);border-bottom:8px solid #b99269}.board{position:absolute;right:22px;top:52px;background:#fffef3;border:8px solid #b38e64;padding:12px;width:190px}.tables{position:absolute;left:7%;right:7%;bottom:50px;height:190px;background:#c89e69;border-radius:12px;box-shadow:0 12px 0 #a87e52}.people{position:absolute;left:4%;right:4%;bottom:78px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.person{border:0;background:transparent;text-align:center;position:relative}.avatar{width:92px;height:92px;margin:auto;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 10px #0002;display:grid;place-items:center;font-size:46px;transition:.2s}.person:hover .avatar{transform:translateY(-4px)}.name{display:inline-block;background:#fff;border-radius:10px;padding:5px 10px;margin-top:5px;font-weight:800}.bubble{position:absolute;top:-64px;left:50%;transform:translateX(-50%);width:155px;background:#fff;border:1px solid #aaa;border-radius:13px;padding:7px;font-size:12px;min-height:48px}.side h3{margin:0 0 8px}.profile{display:flex;gap:10px;align-items:center}.mini{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--blue)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button,.modal button,.next{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;font-weight:700}.actions button:hover,.modal button:hover{border-color:#6ca5c8;background:#f6fbfe}.log{margin:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.logbox{height:150px;overflow:auto;font-size:13px;line-height:1.55}.notice{background:#fff7d9;border-left:5px solid #e4b94d;padding:9px;margin:7px 0}.event{background:#fde8e8;border-left:5px solid #d56b6b;padding:9px;margin:7px 0}.warm{background:#eef8e9;border-left:5px solid #79aa65;padding:9px;margin:7px 0}.modalwrap{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:20px;z-index:9}.modal{background:#fff;border-radius:20px;max-width:620px;width:100%;padding:22px;max-height:85vh;overflow:auto}.choices{display:grid;gap:9px;margin-top:15px}.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.meter{font-size:11px;background:#f5f2ed;padding:7px;border-radius:9px}.hidden{display:none!important}.end{text-align:center;padding:45px 20px}.end h2{font-size:32px}.small{font-size:12px;color:#786d64}@media(max-width:800px){.top{grid-template-columns:1fr 1fr}.top .goal{grid-column:1/-1}.main{grid-template-columns:1fr}.people{grid-template-columns:repeat(2,1fr);bottom:20px}.room{min-height:650px}.tables{height:390px}.log{grid-template-columns:1fr}.bubble{width:130px}.side{order:-1}}
</style></head><body><div class="app" id="app">
<header><div><div class="logo">きょうも、ここで。</div><div class="tag">～ひとりひとりの「はたらく」を支える～</div></div><div class="tag">試作版：5日間の新人職員体験</div></header>
<div id="game">
<div class="top"><div class="card"><div id="day" class="day">DAY 1</div><div id="date">月曜日</div></div><div class="card"><div class="clock" id="clock">9:00</div><div id="phase">朝の準備</div><div class="timeline"><div id="progress"></div></div></div><div class="card goal"><b>今日のテーマ</b><div id="theme" style="margin-top:6px">まずは4人を知ろう。</div><div class="small" style="margin-top:8px">時間は行動するたびに進みます。</div></div></div>
<div class="main"><div class="card room"><div class="window"></div><div class="board"><b>本日の作業</b><br>部品の袋詰め<br>シール貼り<br>箱詰め<br>検品</div><div class="tables"></div><div class="people" id="people"></div></div>
<aside class="card side"><h3>利用者の様子</h3><div id="selected"><div class="small">人物をタップしてください。表情や言葉、作業の様子から気づくことがあります。</div></div><div class="actions hidden" id="actions"><button data-act="observe">👁 様子を見る</button><button data-act="talk">💬 声をかける</button><button data-act="help">🤝 一緒に作業</button><button data-act="wait">☕ 少し待つ</button><button data-act="record">📝 記録する</button><button data-act="consult">👥 職員に相談</button></div><div class="meters"><div class="meter">気づき<br><b id="m-observe">0</b></div><div class="meter">尊重<br><b id="m-respect">0</b></div><div class="meter">安全<br><b id="m-safe">0</b></div><div class="meter">連携<br><b id="m-team">0</b></div></div></aside></div>
<div class="log"><div class="card"><b>今日の出来事</b><div id="events" class="logbox"></div></div><div class="card"><b>あなたの記録</b><div id="notes" class="logbox"><div class="small">気づいたことを「記録する」と翌日以降に役立ちます。</div></div></div></div></div>
<div id="ending" class="hidden end"></div></div>
<div class="modalwrap" id="modalwrap"><div class="modal"><div id="modal"></div></div></div>
<script>
const chars={
 sato:{name:'佐藤さん',emoji:'🧑🏻‍💼',color:'#dbe8df',base:'口数は少なめ。丁寧に作業しています。'},
 tanaka:{name:'田中さん',emoji:'👨🏻',color:'#dce9fb',base:'明るい表情。新しい作業に挑戦中です。'},
 yamada:{name:'山田さん',emoji:'👩🏻',color:'#f5dfeb',base:'周囲にもよく気づきます。検品が得意です。'},
 suzuki:{name:'鈴木さん',emoji:'🧑🏻',color:'#f4dfd7',base:'集中すると作業が速い人です。予定変更は少し苦手。'}
};
let S={day:1,min:540,selected:null,score:{observe:0,respect:0,safe:0,team:0},known:{},notes:{},relation:{sato:0,tanaka:0,yamada:0,suzuki:0},flags:{},actions:0};
const themes=['まずは4人を知ろう。','「昨日と違う」を見つけよう。','行動の理由を考えよう。','生活の場面でも尊厳を守ろう。','一人で抱えず、一日を支えよう。'];
const daily={
1:{sato:'静かに部品を並べている。',tanaka:'「これ、合ってます？」と何度か確認している。',yamada:'笑顔でシール貼り。',suzuki:'黙々と箱を組み立てている。'},
2:{sato:'昨日より手が遅い。時々目をこする。',tanaka:'昨日より迷わず袋詰めしている。',yamada:'いつも通り検品中。',suzuki:'時計を何度も見ている。'},
3:{sato:'今日は普段の速度に戻った。',tanaka:'自分で工程表を確認している。',yamada:'少し食欲がないと言っていた。',suzuki:'作業変更を聞いて眉をひそめた。'},
4:{sato:'落ち着いて作業中。',tanaka:'箱詰めにも興味を示している。',yamada:'昼食のペースが遅い。水分も少なめ。',suzuki:'午前は安定している。'},
5:{sato:'あなたを見ると小さく会釈した。',tanaka:'袋詰めを一人で進めている。',yamada:'今日は食事も普段通り。',suzuki:'急な予定変更の知らせを聞いた。'}
};
function render(){document.querySelector('#day').textContent='DAY '+S.day;document.querySelector('#date').textContent=['','月曜日','火曜日','水曜日','木曜日','金曜日'][S.day];document.querySelector('#theme').textContent=themes[S.day-1];clock();let p=document.querySelector('#people');p.innerHTML='';Object.entries(chars).forEach(([id,c])=>{let b=document.createElement('button');b.className='person';b.innerHTML=`<div class="bubble">${daily[S.day][id]}</div><div class="avatar" style="background:${c.color}">${c.emoji}</div><div class="name">${c.name}</div>`;b.onclick=()=>select(id);p.appendChild(b)});meters();}
function clock(){let h=Math.floor(S.min/60),m=S.min%60;document.querySelector('#clock').textContent=`${h}:${String(m).padStart(2,'0')}`;let pct=Math.min(100,(S.min-540)/(420)*100);document.querySelector('#progress').style.width=pct+'%';document.querySelector('#phase').textContent=S.min<600?'朝の作業':S.min<720?'午前の作業':S.min<780?'昼食・休憩':S.min<930?'午後の作業':'終わりの時間';}
function select(id){S.selected=id;let c=chars[id];document.querySelector('#selected').innerHTML=`<div class="profile"><div class="mini" style="background:${c.color}">${c.emoji}</div><div><b>${c.name}</b><div class="small">${c.base}</div></div></div><div class="notice">今：${daily[S.day][id]}</div>`;document.querySelector('#actions').classList.remove('hidden');}
function advance(n=10){S.min+=n;S.actions++;clock();trigger();if(S.min>=960)endDay();}
function log(t,cls='notice'){document.querySelector('#events').insertAdjacentHTML('afterbegin',`<div class="${cls}">${fmt()}　${t}</div>`)}
function fmt(){let h=Math.floor(S.min/60),m=S.min%60;return `${h}:${String(m).padStart(2,'0')}`}
function meters(){for(let k of ['observe','respect','safe','team'])document.querySelector('#m-'+k).textContent=S.score[k]}
function action(a){if(!S.selected)return;let id=S.selected,d=S.day;let text='';if(a==='observe'){S.score.observe++;text=`${chars[id].name}を少し離れて観察した。${daily[d][id]}`;if(d===2&&id==='sato'){S.known.satoTired=true;text+=' 昨日より明らかに作業速度が遅い。';S.score.observe+=2}if(d===4&&id==='yamada'){S.known.yamadaMeal=true;text+=' 飲み込みを急いでいるわけではないが、食事と水分が昨日より少ない。';S.score.safe+=2}if(d===5&&id==='suzuki'){S.known.suzukiChange=true;text+=' 予定表を見て落ち着かない様子。';S.score.observe+=2}}else if(a==='talk'){S.relation[id]++;S.score.respect++;text=`${chars[id].name}に短く声をかけ、返事を待った。`;if(d===2&&id==='sato')text+='「昨日あまり眠れなくて」と教えてくれた。';if(d===3&&id==='suzuki')text+='「急に変わるの、嫌なんだよ」と話した。';if(d===4&&id==='yamada')text+='「今日はあまり食べたくない」と小声で話した。'}else if(a==='help'){text=`${chars[id].name}の作業に手を出した。`;if(id==='tanaka'&&S.relation[id]<2){text+=' 田中さんは少し黙ってしまった。自分で考えていたようだ。';S.score.respect=Math.max(0,S.score.respect-1)}else{S.score.respect++;text+=' 必要なところだけ一緒に確認した。'}}else if(a==='wait'){S.score.respect++;text=`すぐ介入せず、${chars[id].name}がどうするか少し待った。`;if(id==='tanaka'){text+=' 工程表を見て、自分で次の作業を思い出した。';S.relation[id]+=2}}else if(a==='record'){S.notes[id]=daily[d][id];S.score.team++;text=`${chars[id].name}の今日の様子を事実として記録した。`;document.querySelector('#notes').insertAdjacentHTML('afterbegin',`<div class="warm">DAY ${d} ${chars[id].name}：${daily[d][id]}</div>`)}else if(a==='consult'){S.score.team+=2;text=`他の職員に${chars[id].name}の普段の様子と今日の変化を確認した。`;if(id==='suzuki')text+='「予定が急に変わる時は、見通しを伝えると安心しやすい」と分かった。';}log(text,a==='help'?'notice':'warm');meters();advance(a==='consult'?15:10)}
function trigger(){let d=S.day;if(d===2&&S.min>=650&&!S.flags.d2){S.flags.d2=true;scenario('昼前の変化','佐藤さんが部品を何度も数え直しています。一方、田中さんはあなたを呼んでいます。','どちらも「困っている」ように見えます。昨日からの違いを考えて動いてください。',[['佐藤さんの様子を先に見る',()=>{S.selected='sato';S.score.observe+=2;log('昨日との差を優先して佐藤さんを確認した。','warm')}],['田中さんの作業を代わりにやる',()=>{S.score.respect=Math.max(0,S.score.respect-1);log('田中さんは「自分でやってみたかった」と少し残念そう。','event')}],['職員に田中さんを見てもらい、自分は佐藤さんへ',()=>{S.score.team+=3;S.score.observe+=2;log('役割を分け、二人とも待たせず対応できた。','warm')}]]);}
if(d===3&&S.min>=620&&!S.flags.d3){S.flags.d3=true;scenario('突然、大きな声','作業変更を伝えられた鈴木さんが「なんで変えるんだよ！」と箱を強く置きました。周囲の利用者もこちらを見ています。','行動だけを止めるのか、その背景を見るのか。安全と本人の尊厳の両方が問われます。',[['少し距離をとり、周囲の安全を確保する',()=>{S.score.safe+=3;S.score.respect+=2;log('刺激を増やさず、安全な距離と周囲を確保した。','warm')}],['大きな声で「落ち着いて」と注意する',()=>{S.score.safe=Math.max(0,S.score.safe-1);log('鈴木さんの声がさらに大きくなった。','event')}],['別職員に周囲を任せ、本人には短く予定変更を説明',()=>{S.score.team+=2;S.score.respect+=3;log('周囲を守りながら、鈴木さんに見通しを伝えた。少しずつ落ち着いた。','warm')}]]);}
if(d===4&&S.min>=760&&!S.flags.d4){S.flags.d4=true;scenario('昼食後の出来事','食事のあと、田中さんが衣服を汚してしまいました。本人は周囲を気にして下を向いています。','「早く片付ける」だけではない場面です。',[['周囲から見えにくい場所へ案内し、本人の希望を聞く',()=>{S.score.respect+=4;S.score.safe+=2;log('人目への配慮をしながら、着替えや必要な支援を本人と確認した。','warm')}],['その場ですぐ衣服を確認する',()=>{S.score.respect=Math.max(0,S.score.respect-2);log('処置は早かったが、本人は周囲の視線を気にしていた。','event')}],['別職員に着替え準備を頼み、自分は本人のそばへ',()=>{S.score.team+=3;S.score.respect+=3;log('役割分担し、本人を一人にせず対応した。','warm')}]]);}
if(d===5&&S.min>=850&&!S.flags.d5){S.flags.d5=true;familyCall();}}
function scenario(title,body,hint,choices){let w=document.querySelector('#modalwrap'),m=document.querySelector('#modal');m.innerHTML=`<h2>${title}</h2><p>${body}</p><div class="notice">${hint}</div><div class="choices" id="choices"></div>`;let c=m.querySelector('#choices');choices.forEach(x=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>{x[1]();meters();w.style.display='none';advance(10)};c.appendChild(b)});w.style.display='grid'}
function familyCall(){scenario('ご家族から電話','「最近、山田が家で疲れているみたいなんですが、施設ではどうですか？」','DAY 4の食事の様子を覚えていますか。家族には安心感だけでなく、事実・施設での対応・その後の様子を伝えることも大切です。',[['「特に問題ありませんでした」と答える',()=>{log('安心させようとしたが、施設で見られた変化を共有できなかった。','event')}],['記録を確認し、食事量・水分・本人の言葉・その後の様子を事実で伝える',()=>{S.score.team+=4;S.score.respect+=2;log('記録をもとに事実と対応を伝え、今後も一緒に様子を見ることにした。','warm')}],['心配なので施設側の推測を詳しく伝える',()=>{S.score.team=Math.max(0,S.score.team-1);log('確認できていない推測まで話してしまった。事実との区別が必要だった。','event')}]]);}
function endDay(){S.min=960;let special='';if(S.day===1)special='まだ4人のことはよく分かりません。でも、明日なら「今日との違い」が見えるかもしれません。';if(S.day===2)special=S.known.satoTired?'佐藤さんが帰り際に「気づいてくれて、ありがとう」と小さく言いました。':'今日は見えなかった変化もありました。明日はもう少し人を見てみましょう。';if(S.day===3)special='鈴木さんが帰り際に「さっきはごめん。急に変わるとびっくりするんだ」と話してくれました。';if(S.day===4)special=S.relation.tanaka>=2?'田中さんが「今日は自分でできたところ、増えました」と笑いました。':'支援することと、本人が自分でできるのを待つこと。その両方があります。';if(S.day===5){finish();return}scenario('DAY '+S.day+' 終了',special,'この仕事では「全部やってあげる」ことだけが支援ではありません。今日知ったその人の姿が、明日の気づきにつながります。',[['次の日へ',()=>{S.day++;S.min=540;S.selected=null;S.flags={};document.querySelector('#actions').classList.add('hidden');document.querySelector('#selected').innerHTML='<div class="small">人物をタップしてください。</div>';render();log('DAY '+S.day+' が始まりました。','notice')}]]);}
function finish(){document.querySelector('#game').classList.add('hidden');let e=document.querySelector('#ending');e.classList.remove('hidden');let total=Object.values(S.score).reduce((a,b)=>a+b,0);e.innerHTML=`<h2>5日間、おつかれさまでした。</h2><p>最初は知らない4人だったのに、今は少し「明日はどうしているかな」と思える人がいませんか。</p><div class="card" style="max-width:650px;margin:25px auto;text-align:left"><b>あなたがこの5日間で使った力</b><p>気づく力：${S.score.observe}　／　尊重する力：${S.score.respect}<br>安全を見る力：${S.score.safe}　／　つなぐ力：${S.score.team}</p><div class="warm">福祉経験だけが、この仕事の入口ではありません。接客、営業、製造、事務、子育てなどで培った「人を見る」「待つ」「伝える」「誰かと協力する」力も、ここで活きます。</div><p><b>${total>=28?'田中さん：「来週、箱詰めもやってみたいです。見ててください。」':'佐藤さん：「また来週もいるんですか？」'}</b></p></div><button class="next" onclick="location.reload()">別の関わり方でもう一度</button>`}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));render();log('新人職員としての5日間が始まりました。まずは施設の人たちを見てみましょう。');
</script></body></html>
